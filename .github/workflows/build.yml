name: Build TENIx MODs D2 ZAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure logo.png exists in assets
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/logo.png ]; then
            convert -size 192x192 xc:none \
              -fill "#7C3AED" -draw "roundrectangle 10,10 182,182 42,42" \
              -gravity center -pointsize 110 -fill white -annotate 0 "T" \
              app/src/main/assets/logo.png && echo "placeholder logo created" \
              || echo "logo skipped - app will use fallback logo"
          fi

      - name: Build APKs (Debug + Release)
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TENIx-MODs-D2-ZAI-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
